[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Configuración para tests de integración con Superfluid
# Los tests de integración requieren fork de mainnet
# Puedes configurar la URL del fork aquí o pasarla como variable de entorno
[profile.default.fuzz]
runs = 256

# Configuración para tests con fork
# Para ejecutar tests de integración, usa:
# forge test --fork-url <RPC_URL> --match-path test/SuperfluidIntegration.t.sol
# O configura MAINNET_RPC_URL como variable de entorno
